[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forex-operator"
version = "0.1.0"
description = "Local-first automated Forex trading system"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PyYAML>=6.0.2,<7",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<1",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
score-training = ["numpy>=2,<3", "scikit-learn>=1.6,<2"]
firebase = ["firebase-admin>=7.1,<8"]
mt5 = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]
dev = ["mypy>=1.11,<2", "pytest>=8.3,<10", "ruff>=0.6,<1", "types-PyYAML>=6.0"]

[project.scripts]
forex = "forex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["forex"]
ignore_missing_imports = true
