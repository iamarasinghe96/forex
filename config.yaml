# All operator-tunable, non-secret settings live in this file. Secrets belong in .env.
mode: paper                    # Keep paper until the paper soak layer is signed off.
operator_timezone: Australia/Sydney

broker:
  login: 23011822
  server: ICMarketsAU-Demo
  terminal_path: null          # null lets MetaTrader5 find the installed terminal.
  account_currency: AUD        # Startup fails if MT5 reports a different currency.
  symbols: [EURUSD, GBPUSD, USDJPY]
  symbol_overrides: {EURUSD: EURUSD.a, GBPUSD: GBPUSD.a, USDJPY: USDJPY.a}
  magic_number: 26092801
  connect_timeout_seconds: 30

logging:
  directory: logs
  max_bytes: 10485760
  backup_count: 10

database:
  path: data/forex.sqlite3

# Layer 2 operational defaults; these are not validated strategy parameters.
market_data:
  stale_h1_hours: 3
  stale_h4_hours: 8
  weekend_close_weekday: 4      # Friday (Monday=0), approximate and not DST-validated.
  weekend_close_hour_utc: 22
  weekend_open_weekday: 6       # Sunday, approximate and not DST-validated.
  weekend_open_hour_utc: 22
  history_chunk_days: 90
  history_retry_count: 3
  server_clock_tolerance_seconds: 300  # UNVALIDATED operational clock sanity tolerance.

# Layer 3 research starting points. Every value is UNVALIDATED and versioned for Layer 4 testing.
analysis:
  strategy_version: layer3-v1
  # Operator-chosen aggressive PAPER profile 2026-10-01 (J6-a/J6-b failed the pre-registered
  # 13-year test; operator accepts the risk on paper). Previous: trend-only-v1.
  parameter_version: operator-aggressive-v1
  ema_fast: 20
  ema_slow: 50
  ema_context: 200
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  structure_window: 20
  volatility_window: 100
  slope_lookback: 5
  return_horizons: [1, 5, 20]
  trend_threshold: 0.55
  range_threshold: 0.58
  setup_score_threshold: 0.45
  extreme_zscore: 1.0
  swing_trend_threshold: 0.68
  # Range mean-reversion lost in every OOS year (research_summary.py); trend setups only.
  allowed_setups: [TREND_CONTINUATION_BREAKOUT_PULLBACK]
  # Journal J6 switches (UNTESTED; defaults keep current behaviour):
  high_volatility_blocks_trend: false  # J6-a ON: strong trends still trade in top-decile volatility.
  trend_efficiency_window: 10          # J6-b ON: faster trend detection (null = 20 H4 bars).

# Layer 4 research-only assumptions. They never alter strategy parameters or place orders.
backtest:
  forward_horizons_bars: [6, 24, 120]  # Explicit and UNVALIDATED.
  simulation_horizon_bars: 120         # Explicit and UNVALIDATED.
  reward_risk: 1.5                     # Research exit assumption, not Layer 5 risk sizing.
  breakeven_at_r: 1.0
  atr_trailing_multiple: null
  ambiguity_policy: adverse
  minimum_history_years: 5.0
  monte_carlo_iterations: 1000
  monte_carlo_seed: 26092801
  train_days: 730
  test_days: 180
  step_days: 180
  final_holdout_days: 365
  report_directory: reports/backtest

telegram:
  enabled: true   # Operator-approved 2026-09-30 for supervised PAPER run.
  timeout_seconds: 10

# Layer 6: disabled until local keys and current JSON-capable model IDs are configured.
# Timeouts/retries/token caps are UNVALIDATED operational limits, not strategy parameters.
context:
  enabled: true   # Operator-approved 2026-09-30; review can only approve/reject/reduce.
  providers:
    - {name: groq, model: "openai/gpt-oss-120b"}
    - {name: gemini, model: "gemini-3.1-flash-lite"}
    - {name: openrouter, model: "google/gemma-4-31b-it:free"}  # Key valid; setup response rate-limited (429).
  timeout_seconds: 15
  attempts_per_provider: 2
  retry_backoff_seconds: 1
  max_output_tokens: 1500
  prompt_file: src/forex/prompts/context-review-v1.md

# Reserved risk profile; implemented in Layer 5, not used to place orders in Layer 1.
risk:
  max_leverage: 30
  minimum_reward_risk: 1.5
  max_concurrent_positions: 4
  max_simultaneous_risk_percent: 20
  daily_loss_percent: 25   # Aggressive paper profile (was 12).
  tax_reserve_percent: 32.5
  # At 5% risk, 8 consecutive full-risk losses compound to about a 33.7% drawdown.
  conviction_risk_percent: {low: 5.0, medium: 5.0, high: 5.0}   # Aggressive paper profile (was 2/3.5/5).
  conviction_thresholds: {minimum: 0, medium: 70, high: 85}  # Minimum 0 = no confidence floor (was 55).
  target_trades_per_week: {minimum: 3, maximum: 8}

# Layer 7 operational defaults (UNVALIDATED). No command enables broker execution.
execution:
  demo_enabled: false
  maximum_quote_age_seconds: 30
  maximum_decision_age_seconds: 300
  session_rollover_hour_utc: null  # Alternative fixed UTC boundary; exclusive with policy below.
  session_rollover: new_york_close  # 17:00 America/New_York, with automatic US DST.

# Layer 8 cloud mirror stays disabled until Firebase credentials/security setup is verified.
# Retry/poll/batch limits are UNVALIDATED operational defaults.
cloud:
  enabled: true   # Operator-approved 2026-09-30; remote halt below stays off.
  emergency_halt_enabled: false
  project_id: "forex-paper-bot"
  poll_seconds: 10
  batch_size: 50
  retry_base_seconds: 5
  retry_maximum_seconds: 300

# Layer 10 stays disabled until explicit paper setup; never places MT5 orders.
paper:
  enabled: true   # Operator-approved 2026-09-30 supervised PAPER run; never sends MT5 orders.
  # Fresh A$1,000 paper account from 2026-10-01 so the 0.01-lot minimum fits the 2-5% risk budget
  # (on A$100 most stops did not fit). The A$100 history stays in data/paper.sqlite3.
  database: data/paper-a1000.sqlite3
  starting_balance_aud: 1000
  poll_seconds: 5
  history_days: 365
  heartbeat_file: data/paper-heartbeat.json
  health_journal_seconds: 60   # Journal/Firestore health cadence; heartbeat file stays every cycle.
  error_repeat_seconds: 3600   # Repeated identical cycle failures: first, then hourly, then recovery.
  error_grace_seconds: 30      # Failures shorter than this are logged locally, not alerted.
  halt_file: data/HALT_PAPER
  no_trade_hours: 168
  # Journal J6-c exits (UNTESTED; paper only). Use a target above 1.5 so small price moves during
  # review cannot push the reward below the 1.5R minimum.
  target_reward_risk: 10.0      # Let winners run: far target, the trailing stop exits (null = 1.5R).
  atr_trailing_multiple: 3.0    # Trail 3x H1 ATR behind price once a trade is +1R (null = off).

# Learning loop (PAPER only). Every closed trade is scored and explained; weak decision buckets
# trade smaller (never above the risk above). Strategy changes arrive only as validated change
# sets approved in Telegram (/review, paste Claude's reply, /approve N); see docs/LEARNING_LOOP.md.
learning:
  enabled: true
  trade_reviews: true        # AI explanation of each closed trade (uses the context providers above).
  apply_to_sizing: true
  prior_trades: 20           # Caution: a bucket's score counts this many imaginary 0 R trades.
  min_trades: 10             # A bucket changes sizing only after this many closed trades.
  min_factor: 0.25           # Weakest buckets trade at 25% of normal size.
  skip_below_r: null         # e.g. -0.3 to skip clearly losing buckets entirely.
  disabled_pairs: []
  telegram_commands: true
